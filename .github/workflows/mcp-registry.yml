name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io on every v* tag,
# AFTER the npm publish workflow lands. Auth is via GitHub OIDC — the
# `noticedso` org claim grants the `io.github.noticedso/*` namespace, no token
# needed. Duplicate (name@version) publishes are rejected by the registry, so
# the workflow re-syncs server.json's version field from the git tag.

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Sync server.json version with package.json
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "Publishing version $VERSION"
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate ./server.json

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          # npm can acknowledge a publish before its public registry replicas
          # serve the new version. The MCP Registry validates npm availability,
          # so retry this bounded propagation race instead of failing the deploy.
          for attempt in {1..12}; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::MCP Registry publish failed after $attempt attempts."
              exit 1
            fi
            echo "npm version is not visible to the MCP Registry yet; retrying in 10 seconds ($attempt/12)."
            sleep 10
          done
